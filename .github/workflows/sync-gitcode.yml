name: Sync to GitCode

on:
  push:
    branches: [master, main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitCode
        run: |
          git remote add gitcode https://gitcode.com/unknowbug/qlens.git
          git push gitcode --all --force
